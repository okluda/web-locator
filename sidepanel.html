<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網頁定位工具</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>網頁定位工具</h1>
      <p class="app-description">選定目標分頁，並管理網頁輸入欄位定位。</p>
    </header>

    <div id="operationArea" class="panel-group operation-group">
      <div class="group-header"><h2>操作區</h2><span id="setupGuideText" class="inline-status"></span></div>
    <section class="panel-section" aria-labelledby="triggerHeading">
      <div class="section-heading">
        <div>
          <h2 id="triggerHeading">板機區</h2>
        </div>
        <span id="executionBadge" class="status-badge status-idle">待命</span>
      </div>
      <p class="compact-safety-note">安全填值不會送出；手動板機會將操作交回原網頁。</p>

      <div class="trigger-buttons">
        <button id="executePlanButton" class="primary-button" type="button" disabled>
          執行安全填值
        </button>
        <button id="stopExecutionButton" class="secondary-button danger-button" type="button" disabled>
          停止執行
        </button>
        <button id="focusAimButton" class="secondary-button" type="button" disabled>
          手動板機
        </button>
      </div>

      <div id="executionResult" class="execution-result" hidden></div>

      <p id="executionStatusText" class="inline-status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel-section" aria-labelledby="ammunitionHeading">
      <div class="list-header">
        <div>
          <h2 id="ammunitionHeading">填彈區</h2>
        </div>
        <span id="ammunitionCount" class="item-count">5 列</span>
      </div>

      <div class="privacy-notice" role="note">
        請勿輸入密碼、驗證碼、卡號或其他非必要敏感資料。
      </div>

      <div id="ammunitionList" class="ammunition-list" aria-label="待填資料列"></div>

      <div class="ammunition-buttons">
        <button id="addAmmunitionButton" class="secondary-button" type="button">
          新增資料列
        </button>
        <button id="clearAmmunitionButton" class="secondary-button" type="button">
          清空全部內容
        </button>
        <button id="validateAmmunitionButton" class="secondary-button" type="button" disabled>
          執行前檢查
        </button>
      </div>

      <div id="executionPlan" class="execution-plan" hidden></div>

      <p id="ammunitionStatusText" class="inline-status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel-section" aria-labelledby="aimHeading">
      <div class="section-heading">
        <div>
          <h2 id="aimHeading">準星區</h2>
        </div>
        <span id="aimBadge" class="status-badge status-idle">未選取</span>
      </div>

      <div id="aimEmptyState" class="aim-empty-state">
        尚未選取準星按鈕。
      </div>

      <dl id="aimDetails" class="aim-details" hidden>
        <div class="aim-detail-row">
          <dt>名稱</dt>
          <dd id="aimName"></dd>
        </div>
        <div class="aim-detail-row">
          <dt>類型</dt>
          <dd id="aimType"></dd>
        </div>
        <div class="aim-detail-row">
          <dt>Selector</dt>
          <dd><code id="aimSelector"></code></dd>
        </div>
      </dl>

      <div class="aim-buttons aim-buttons-three">
        <button id="aimSelectButton" class="primary-button" type="button">
          開始選取準星
        </button>
        <button id="testAimButton" class="secondary-button" type="button" disabled>
          測試準星
        </button>
        <button id="clearAimButton" class="secondary-button" type="button" disabled>
          清除準星
        </button>
      </div>

      <div id="aimTestResult" class="aim-test-result" hidden></div>

      <p id="aimStatusText" class="inline-status" role="status" aria-live="polite"></p>
    </section>
    </div>

    <div class="setup-toggle-row">
      <button id="toggleSetupButton" class="secondary-button" type="button" aria-expanded="true">收合設定區</button>
      <button id="goToTargetButton" class="secondary-button" type="button">前往瞄準區</button>
    </div>

    <div id="setupArea" class="panel-group setup-group">
      <div class="group-header"><h2>設定區</h2></div>
    <section class="panel-section" aria-labelledby="targetHeading">
      <div class="section-heading">
        <div>
          <h2 id="targetHeading">瞄準區</h2>
        </div>
        <span id="targetBadge" class="status-badge status-idle">未瞄準</span>
      </div>

      <div id="targetEmptyState" class="target-empty-state">
        尚未選定目標分頁。
      </div>

      <dl id="targetDetails" class="target-details" hidden>
        <div class="target-detail-row">
          <dt>標題</dt>
          <dd id="targetTitle"></dd>
        </div>
        <div class="target-detail-row">
          <dt>網站</dt>
          <dd id="targetOrigin"></dd>
        </div>
        <div class="target-detail-row">
          <dt>路徑</dt>
          <dd id="targetPath"></dd>
        </div>
      </dl>

      <div class="target-buttons">
        <button id="targetCurrentTabButton" class="primary-button" type="button">
          瞄準目前分頁
        </button>
        <button id="clearTargetButton" class="secondary-button" type="button" disabled>
          取消瞄準
        </button>
      </div>

      <p id="targetStatusText" class="inline-status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel-section" aria-labelledby="locatorHeading">
      <div class="section-heading">
        <div>
          <h2 id="locatorHeading">定位區</h2>
        </div>
        <span id="modeBadge" class="status-badge status-idle">待命</span>
      </div>

      <div id="statusBox" class="status-box" role="status" aria-live="polite">
        <strong>目前狀態：</strong>
        <span id="statusText">尚未開始定位</span>
      </div>

      <button id="locateButton" class="primary-button" type="button" aria-pressed="false">
        開始定位
      </button>
    </section>
    <section class="panel-section" aria-labelledby="listHeading">
      <div class="list-header">
        <h2 id="listHeading">定位清單</h2>
        <span id="itemCount" class="item-count">0 筆</span>
      </div>

      <div id="emptyState" class="empty-state">
        <p class="empty-title">目前尚未記錄任何網頁欄位</p>
        <p class="empty-description">開始定位後，點選支援的輸入欄位。</p>
      </div>

      <ul id="locatorList" class="locator-list" aria-label="已記錄的定位清單"></ul>

      <div class="list-buttons">
        <button id="testAllButton" class="secondary-button" type="button" disabled>
          測試全部定位
        </button>
        <button id="clearButton" class="secondary-button danger-button" type="button" disabled>
          清除全部定位
        </button>
      </div>
    </section>
    </div>

    <footer class="app-footer">第 18.5 焦點修正版 0.18.5</footer>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
